<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Desmos Embed Viewer</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
  }

  header {
    padding: 10px;
    background: #222;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  button {
    background: #4cafef;
    border: none;
    padding: 8px 12px;
    color: white;
    cursor: pointer;
    border-radius: 6px;
  }

  iframe {
    width: 100%;
    height: calc(100vh - 50px);
    border: none;
    background: white;
  }

  #fallback {
    display: none;
    padding: 20px;
  }

  a {
    color: #4cafef;
  }
</style>
</head>
<body>

<header>
  <div>Desmos Embed Viewer</div>
  <button onclick="reloadFrame()">Reload</button>
</header>

<iframe id="frame" src="https://dev.desmos.live.cdn.cloudflare.net/"></iframe>

</body>
</html>
