<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>App Updater</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 520px;
      margin: 60px auto;
      padding: 0 24px;
      color: #1a1a1a;
    }
    h1 { font-size: 22px; font-weight: 500; margin-bottom: 4px; }
    .sub { color: #666; font-size: 14px; margin-bottom: 32px; }
    .card {
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 16px;
    }
    .label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: .05em; }
    .version { font-size: 28px; font-weight: 500; margin: 4px 0 0; }
    .row { display: flex; gap: 12px; margin-bottom: 16px; }
    .row .card { flex: 1; margin: 0; }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 500;
      margin-top: 6px;
    }
    .up-to-date { background: #e6f4ea; color: #1e6e34; }
    .outdated   { background: #fff3cd; color: #7d4a00; }
    .notes {
      background: #f7f7f7;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 14px;
      color: #333;
      margin-bottom: 16px;
      display: none;
    }
    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity .15s;
    }
    button:hover { opacity: .85; }
    #btn-check { background: #1a1a1a; color: #fff; }
    #btn-download { background: #1a6fe8; color: #fff; display: none; }
    #status { font-size: 13px; color: #666; margin-top: 12px; text-align: center; min-height: 20px; }
    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid #ccc;
      border-top-color: #555;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <h1>App Updater</h1>
  <p class="sub">Checks GitHub for the latest release of your app.</p>

  <div class="row">
    <div class="card">
      <div class="label">Current version</div>
      <div class="version" id="local-ver">—</div>
    </div>
    <div class="card">
      <div class="label">Latest version</div>
      <div class="version" id="remote-ver">—</div>
      <div id="status-badge"></div>
    </div>
  </div>

  <div class="notes" id="notes-box">
    <strong>What's new:</strong> <span id="notes-text"></span>
  </div>

  <button id="btn-check" onclick="checkForUpdate()">Check for updates</button>
  <button id="btn-download" onclick="downloadUpdate()">Download update</button>
  <div id="status"></div>

  <script>
    // ─── CONFIG — edit these two lines ───────────────────────────────────────
    const LOCAL_VERSION  = "5.0.0";
    const GITHUB_USER    = "unknowngmail";
    const GITHUB_REPO    = "homework.github.io";
    // ─────────────────────────────────────────────────────────────────────────

    const VERSION_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/version.json`;

    let remoteVersion = null;

    function semverGt(a, b) {
      const pa = a.split(".").map(Number);
      const pb = b.split(".").map(Number);
      for (let i = 0; i < 3; i++) {
        if ((pa[i] || 0) > (pb[i] || 0)) return true;
        if ((pa[i] || 0) < (pb[i] || 0)) return false;
      }
      return false;
    }

    function setStatus(msg, spin = false) {
      document.getElementById("status").innerHTML =
        (spin ? '<span class="spinner"></span>' : "") + msg;
    }

    document.getElementById("local-ver").textContent = LOCAL_VERSION;

    async function checkForUpdate() {
      setStatus("Checking GitHub...", true);
      document.getElementById("btn-check").disabled = true;

      try {
        // Use a CORS proxy since GitHub raw doesn't need one, but GitHub API does
        const res = await fetch(VERSION_URL + "?nocache=" + Date.now());
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();

        remoteVersion = data.version;
        document.getElementById("remote-ver").textContent = remoteVersion;

        if (semverGt(remoteVersion, LOCAL_VERSION)) {
          document.getElementById("status-badge").innerHTML =
            '<span class="badge outdated">Update available</span>';
          if (data.notes) {
            document.getElementById("notes-text").textContent = data.notes;
            document.getElementById("notes-box").style.display = "block";
          }
          document.getElementById("btn-download").style.display = "block";
          setStatus("A new version is ready to download.");
        } else {
          document.getElementById("status-badge").innerHTML =
            '<span class="badge up-to-date">Up to date</span>';
          setStatus("You are running the latest version.");
        }
      } catch (err) {
        setStatus("Could not reach GitHub. Check your connection.");
        console.error(err);
      }

      document.getElementById("btn-check").disabled = false;
    }

    function downloadUpdate() {
      if (!remoteVersion) return;
      const tag = "v" + remoteVersion;
      // Downloads the zip asset from GitHub Releases
      // Name your release assets: myapp-v1.0.1.zip
      const url = `https://github.com/${GITHUB_USER}/${GITHUB_REPO}/releases/download/${tag}/myapp-${tag}.zip`;
      setStatus("Opening download in your browser...");
      window.open(url, "_blank");
    }
  </script>
</body>
</html>
