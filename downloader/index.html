<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidoverse Hub</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#0b0b0d;
  color:white;
}

header {
  padding:20px;
  background:#111;
  border-bottom:1px solid #333;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

h1 { color:#e8ff47; font-size:20px; }

.tabs {
  display:flex;
  gap:10px;
  padding:10px;
  background:#15151b;
}

button {
  padding:10px;
  background:#222;
  border:none;
  color:white;
  cursor:pointer;
}

button.active {
  background:#e8ff47;
  color:black;
  font-weight:bold;
}

.container {
  padding:20px;
}

input {
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#111;
  color:white;
  border:1px solid #333;
}

.card {
  margin-top:15px;
  padding:15px;
  background:#15151b;
  border:1px solid #2a2a35;
}

iframe {
  width:100%;
  height:600px;
  border:none;
  border-radius:8px;
}
a {
  display:inline-block;
  margin-top:10px;
  padding:10px;
  background:#e8ff47;
  color:black;
  text-decoration:none;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
  <h1>Vidoverse Hub</h1>
</header>

<div class="tabs">
  <button class="active" onclick="tab('home')">Home</button>
  <button onclick="tab('embed')">Embed Tool</button>
  <button onclick="tab('viewer')">Viewer</button>
  <button onclick="tab('batch')">Batch</button>
</div>

<div class="container">

<!-- HOME -->
<div id="home">
  <div class="card">
    <h3>Vidoverse Downloader Hub</h3>
    <p>This tool opens Vidoverse inside an embedded frame or redirects URLs into it.</p>
  </div>
</div>

<!-- EMBED -->
<div id="embed" style="display:none">
  <div class="card">
    <h3>Open Video in Vidoverse</h3>
    <input id="url" placeholder="Paste YouTube / TikTok / Instagram URL">
    <button onclick="openVido()">Open in Vidoverse</button>
  </div>

  <div id="embedArea" class="card"></div>
</div>

<!-- VIEWER -->
<div id="viewer" style="display:none">
  <div class="card">
    <h3>Embedded Vidoverse Viewer</h3>
    <iframe src="https://vidoverse.com/"></iframe>
  </div>
</div>

<!-- BATCH -->
<div id="batch" style="display:none">
  <div class="card">
    <h3>Batch Open in Vidoverse</h3>
    <textarea id="batchInput" style="width:100%;height:120px;background:#111;color:white"></textarea>
    <button onclick="batch()">Run Batch</button>
  </div>

  <div id="batchOut"></div>
</div>

</div>

<script>
function tab(name){
  document.querySelectorAll(".container > div").forEach(d => d.style.display="none");
  document.getElementById(name).style.display="block";

  document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
  event.target.classList.add("active");
}

function openVido(){
  const url = document.getElementById("url").value.trim();
  if(!url) return;

  const embed = "https://vidoverse.com/?url=" + encodeURIComponent(url);

  document.getElementById("embedArea").innerHTML = `
    <p>Opening in Vidoverse:</p>
    <a href="${embed}" target="_blank">Open Full Page</a>
    <iframe src="${embed}"></iframe>
  `;
}

function batch(){
  const lines = document.getElementById("batchInput").value.split("\n").filter(Boolean);

  document.getElementById("batchOut").innerHTML = lines.map(u => `
    <div class="card">
      ${u}<br>
      <a href="https://vidoverse.com/?url=${encodeURIComponent(u)}" target="_blank">
        Open in Vidoverse
      </a>
    </div>
  `).join("");
}
</script>

</body>
</html>
