<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced URL Embedder</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        .controls { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        
        input { padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        button { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        
        .btn-blue { background-color: #3498db; color: white; flex: 2; }
        .btn-green { background-color: #2ecc71; color: white; flex: 1; }
        button:hover { opacity: 0.8; }

        #error-msg { 
            display: none; background-color: #f8d7da; color: #721c24; 
            padding: 10px; border-radius: 4px; margin-bottom: 15px; border: 1px solid #f5c6cb;
            font-size: 14px;
        }

        .frame-container { border: 2px dashed #ccc; border-radius: 8px; overflow: auto; background: #fafafa; display: flex; justify-content: center; align-items: center; }
        iframe { border: none; background: white; transition: 0.3s; }
    </style>
</head>
<body>

<div class="container">
    <h2>🌐 Site Viewer & Downloader</h2>
    
    <!-- URL and Dimensions -->
    <div class="controls">
        <input type="text" id="urlInput" placeholder="Enter URL (https://...)">
        <input type="number" id="widthInput" placeholder="Width (px)" value="800">
        <input type="number" id="heightInput" placeholder="Height (px)" value="500">
    </div>

    <!-- Actions -->
    <div class="buttons">
        <button class="btn-blue" onclick="updateFrame()">Update & Embed</button>
        <button class="btn-green" onclick="downloadFile()">Download Target URL</button>
    </div>

    <!-- Error Message -->
    <div id="error-msg">
        ⚠️ <b>Embed Blocked:</b> If the box below is empty, the website has security settings (X-Frame-Options) that prevent it from being viewed here. Use the "Download" button to save it instead.
    </div>

    <!-- Embed Area -->
    <div class="frame-container">
        <iframe id="myFrame" width="800" height="500"></iframe>
    </div>
</div>

<script>
    function updateFrame() {
        const urlInput = document.getElementById('urlInput').value;
        const w = document.getElementById('widthInput').value;
        const h = document.getElementById('heightInput').value;
        const frame = document.getElementById('myFrame');
        const error = document.getElementById('error-msg');

        if (!urlInput) return alert("Please enter a URL");

        // Format URL
        let finalUrl = urlInput.trim();
        if (!finalUrl.startsWith('http')) finalUrl = 'https://' + finalUrl;

        // Apply Width/Height
        frame.width = w;
        frame.height = h;

        // Show Error Warning (since we can't detect a 403/CORS error in JS easily)
        error.style.display = "block";
        
        // Load URL
        frame.src = finalUrl;
    }

    function downloadFile() {
        const urlInput = document.getElementById('urlInput').value;
        if (!urlInput) return alert("Please enter a URL to download");

        let finalUrl = urlInput.trim();
        if (!finalUrl.startsWith('http')) finalUrl = 'https://' + finalUrl;

        const a = document.createElement('a');
        a.href = finalUrl;
        a.download = 'website_file.html'; 
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
</script>

</body>
</html>
